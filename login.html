<!DOCTYPE html>
<html>
<head>
  <title>Login – CaptionCraft AI</title>
  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      width: 300px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }
    button {
      padding: 10px;
      width: 100%;
      background: black;
      color: white;
      border: none;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>CaptionCraft AI</h2>
  <input type="email" placeholder="Email">
  <input type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<script>
function login() {
  window.location.href = "index.html";
}
</script>

</body>
</html>
