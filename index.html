
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Caption Craft AI</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header>
    <h1>Caption Craft AI</h1>
    <p>Create viral captions, hashtags, and content ideas in seconds using AI</p>
  </header>

  <div class="cards">
    <div class="card">📸 Instagram Reel Caption</div>
    <div class="card">🎥 YouTube Shorts Caption</div>
    <div class="card">🔥 Trending Hashtags</div>
    <div class="card">💪 Motivational Quote</div>
  </div>

  <div id="chatBox" class="chat-box"></div>

  <div class="input-area">
<div class="upload-area">
  <label>
    📷
    <input type="file" accept="image/*" hidden>
  </label>

  <label>
    🎥
    <input type="file" accept="video/*" hidden>
  </label>

  <label>
    📄
    <input type="file" accept=".pdf,.doc,.txt" hidden>
  </label>
</div>
    <input type="text" id="userInput" placeholder="Ask me to generate captions, hashtags, reels ideas...">
    <button onclick="sendMessage()">➤</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
