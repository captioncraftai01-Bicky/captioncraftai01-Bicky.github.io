<!DOCTYPE html>
<html>
<head>
  <title>Caption Craft AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <!-- LOGO / TITLE -->
    <div class="hero">
      <div class="logo">✨</div>
      <h1>Caption Craft <span>AI</span></h1>
      <p>Create viral captions, hashtags, and content ideas in seconds using AI</p>
    </div>

    <!-- FEATURE CARDS -->
    <div class="cards">
      <div class="card" onclick="selectPrompt('Write 3 viral Instagram Reel captions')">
        📸 <b>Instagram Reel Caption</b>
        <small>Generate viral reel captions</small>
      </div>

      <div class="card" onclick="selectPrompt('Create YouTube Shorts title & description')">
        🎥 <b>YouTube Shorts Caption</b>
        <small>Engaging titles & descriptions</small>
      </div>

      <div class="card" onclick="selectPrompt('Generate trending hashtags')">
        #️⃣ <b>Trending Hashtags</b>
        <small>Boost reach instantly</small>
      </div>

      <div class="card" onclick="selectPrompt('Write a motivational caption')">
        💪 <b>Motivational Quote</b>
        <small>Powerful inspiring lines</small>
      </div>
    </div>

    <!-- CHAT BOX -->
    <div id="chatBox" class="chat"></div>

    <!-- INPUT AREA -->
    <div class="input-area">
      <label class="plus-btn">
        +
        <input type="file" hidden>
      </label>

      <input id="userInput" placeholder="Message CaptionCraft..." />

      <button id="sendBtn" onclick="sendMessage()">
  <span id="arrow">➤</span>
      </button>
    </div>

  </div>

<script src="script.js"></script>
</body>
</html>
